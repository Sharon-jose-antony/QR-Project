name: scanzo_mobile
description: "Scanzo — Community-Powered Zero-Trust QR & Link Safety Gateway"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  http: ^1.2.1
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  flutter_lucide: ^1.0.0
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
