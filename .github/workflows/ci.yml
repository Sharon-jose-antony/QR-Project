name: QRGuard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test-and-build:
    name: Backend Security Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        working-directory: backend
        env:
          DATABASE_URL: "file:./ci.db"
          NODE_ENV: "test"
          SESSION_SECRET: "ci-test-session-secret-key-32-characters-minimum"
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Backend TypeScript Compilation
        working-directory: backend
        run: npx tsc --noEmit

      - name: Execute Security & Unit Test Suites
        working-directory: backend
        env:
          DATABASE_URL: "file:./ci.db"
          NODE_ENV: "test"
          SESSION_SECRET: "ci-test-session-secret-key-32-characters-minimum"
        run: npm test

      - name: Build Backend Production Bundle
        working-directory: backend
        run: npm run build

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: npm run build
