services:
  - type: web
    name: qrguard-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://qrguard-eta.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./prisma/dev.db
